name: Ingest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        type: choice
        default: ingest
        options:
          - ingest
          - check-baseline
          - prepare-baseline
          - resolve-baseline
          - deploy-migrations
      confirmation:
        description: 'Enter PREPARE PRODUCTION BASELINE for prepare-baseline or RESOLVE PRODUCTION BASELINE for resolve-baseline'
        type: string
        default: ''
  push:
    branches: [main]

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: production-ingestion
    timeout-minutes: 20
    concurrency:
      group: production-ingestion
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Require explicit production preparation confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-baseline'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'PREPARE PRODUCTION BASELINE'
      - name: Prepare the legacy production schema and validate parity and privileges
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-baseline'
        run: pnpm db:prepare-baseline
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NODE_ENV: production
      - name: Require explicit production baseline confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'resolve-baseline'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'RESOLVE PRODUCTION BASELINE'
      - name: Check the existing production schema and privileges
        if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'check-baseline' || inputs.operation == 'resolve-baseline')
        run: pnpm db:baseline-check
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NODE_ENV: production
      - name: Record the existing production baseline
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'resolve-baseline'
        run: pnpm db:resolve-baseline
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NODE_ENV: production
      - run: pnpm db:deploy
        if: github.event_name != 'workflow_dispatch' || inputs.operation == 'ingest' || inputs.operation == 'resolve-baseline' || inputs.operation == 'deploy-migrations'
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
          NODE_ENV: production
      # UI-only merges skip ingest. A source, classifier, or ingest-script change
      # must run it, or new boards wait until the next daily schedule.
      - name: Detect whether this merge needs a production ingest
        id: ingestPaths
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          INGEST_ON_PUSH_PATHS: '^(scripts/ingest\.ts|lib/sources/|lib/ingestion/|lib/classification/|\.github/workflows/ingest\.yml)'
        run: |
          set -euo pipefail
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git fetch --depth=1 origin "${BEFORE}"
          if git diff --name-only "${BEFORE}" HEAD | grep -Eq "${INGEST_ON_PUSH_PATHS}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi
      - run: pnpm ingest
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'ingest') || (github.event_name == 'push' && steps.ingestPaths.outputs.run == 'true')
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GREENHOUSE_BOARD_TOKENS: ${{ secrets.GREENHOUSE_BOARD_TOKENS }}
          ASHBY_BOARD_NAMES: ${{ secrets.ASHBY_BOARD_NAMES }}
          LEVER_BOARD_SLUGS: ${{ secrets.LEVER_BOARD_SLUGS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NODE_ENV: production
