services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radar
    ports:
      - '5432:5432'
    volumes:
      - radar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d radar']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  radar-pgdata:
