allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  cypress: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

overrides:
  deepmerge-ts: 8.0.0
  # Keep patched transitive versions until upstream minimums include the fixes.
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'mysql2@<3.23.1': 3.23.1
  'sharp@<0.35.4': 0.35.4
